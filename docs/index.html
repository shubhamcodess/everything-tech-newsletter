<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EverythingTech — all at once.</title>
<meta name="description" content="A daily tech newspaper. 47 sources, read in full and edited by an LLM every morning.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta property="og:title" content="EverythingTech — all at once.">
<meta property="og:description" content="A daily tech newspaper. 47 sources, read in full and edited by an LLM every morning.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="EverythingTech" href="feed.xml">
<link rel="alternate" type="text/markdown" title="Latest edition (Markdown)" href="latest.md">
<link rel="alternate" type="application/json" title="Latest edition (JSON)" href="latest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script>
  // Set the theme before first paint so there's no flash of the wrong one.
  try {
    var saved = localStorage.getItem("et-theme");
    if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<div id="app" aria-live="polite">
  <div class="boot"><span class="boot-cursor">▍</span> loading today's paper…</div>
</div>
<noscript>
  <p class="noscript">This page renders with JavaScript. The same edition is available as
  <a href="latest.md">Markdown</a>, <a href="latest.json">JSON</a> and an <a href="feed.xml">RSS feed</a>.</p>
</noscript>
<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js" defer></script>
</body>
</html>
