name: CI

# Catches what the daily Claude Code routine can't afford to discover on its
# own run: invalid config JSON, or a fetcher script that's actually broken
# (not just one source's feed being temporarily down). Does not generate or
# publish the digest -- that stays the routine's job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate config JSON
        run: |
          for f in config/*.json data/seen.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Smoke-test all fetchers
        run: |
          python scripts/fetch_all.py
          python -c "
          import json
          d = json.load(open('data/raw_latest.json'))
          ok, total = d['ok_sources'], d['total_sources']
          print(f'{ok}/{total} sources ok, {len(d[\"articles\"])} articles')
          # Fail only if fetching is broadly broken, not for a handful of
          # flaky sources (Reddit's 403s are expected -- see CLAUDE.md).
          assert ok >= total * 0.7, f'too many sources failing: {ok}/{total}'
          assert len(d['articles']) > 0, 'zero articles fetched'
          "

      - name: Smoke-test the candidate builder
        run: |
          python scripts/build_candidates.py
          test -s data/candidates.md

      # Editions are Markdown in editions/<date>/edition.md; the site renders
      # them from docs/data/*.json. This fails the build (and so blocks the
      # routine's auto-merge) on an edition that doesn't parse, still carries
      # placeholder text or markup, or wasn't rebuilt into docs/data. It
      # doesn't judge writing quality -- publish_edition.py's validator does
      # that before anything is committed.
      - name: Validate editions and site data
        run: python scripts/validate_editions.py

      # The edition contract (#26): validators must keep giving the answers recorded
      # in tests/golden/, every old edition must still validate, and the site data
      # must rebuild byte-for-byte. Fails the build, so a rule change is deliberate.
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      # schema/*.schema.json is generated from scripts/edition_model.py. Different
      # pydantic releases can word the same schema slightly differently, so a stale
      # file warns instead of blocking the routine's auto-merge.
      - name: Exported JSON Schema is up to date
        continue-on-error: true
        run: python scripts/export_schema.py --check

      - name: Check the site template is present
        run: |
          for f in docs/index.html docs/assets/app.js docs/assets/app.css docs/data/site.json docs/data/index.json; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'assets/app.js' docs/index.html
