name: CI

# Catches what the daily Claude Code routine can't afford to discover on its
# own run: invalid config JSON, or a fetcher script that's actually broken
# (not just one source's feed being temporarily down). Does not generate or
# publish the digest -- that stays the routine's job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate config JSON
        run: |
          for f in config/*.json data/seen.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Smoke-test all fetchers
        run: |
          python scripts/fetch_all.py
          python -c "
          import json
          d = json.load(open('data/raw_latest.json'))
          ok, total = d['ok_sources'], d['total_sources']
          print(f'{ok}/{total} sources ok, {len(d[\"articles\"])} articles')
          # Fail only if fetching is broadly broken, not for a handful of
          # flaky sources (Reddit's 403s are expected -- see CLAUDE.md).
          assert ok >= total * 0.7, f'too many sources failing: {ok}/{total}'
          assert len(d['articles']) > 0, 'zero articles fetched'
          "

      # A routine run once wrote templates/digest.html.template's literal
      # placeholder markup (ARTICLE_URL, ARTICLE_TITLE, ...) straight into
      # docs/index.html instead of real story data, and it merged -- CI
      # validated fetchers, not the actual digest content. This closes
      # that gap: fails the build (and therefore blocks auto-merge, once
      # this job is a required status check -- see SETUP.md) on a digest
      # that's obviously broken, without trying to judge summary quality,
      # which stays a human/LLM call, not CI's.
      - name: Validate digest content
        run: |
          python -c "
          import glob

          BAD_TOKENS = ['ARTICLE_URL', 'ARTICLE_TITLE', 'SOURCE_NAME', 'OTHER_SOURCES',
                        \"Your own brief, engaging summary\"]

          def check(path):
              html = open(path, encoding='utf-8').read()
              if 'awaiting first run' in html:
                  return  # legitimate placeholder state, nothing to check yet
              bad = [t for t in BAD_TOKENS if t in html]
              if bad:
                  raise SystemExit(f'{path}: contains template placeholder text {bad} -- looks like real content was never substituted in')
              if 'class=\"story' not in html:
                  raise SystemExit(f'{path}: has no story content and is not the awaiting-first-run placeholder')
              print(f'{path}: OK')

          check('docs/index.html')
          for p in glob.glob('docs/archive/*.html'):
              if p.endswith('index.html'):
                  continue
              check(p)
          "
