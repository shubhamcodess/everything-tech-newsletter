name: Auto-merge routine branches

# Claude Code routines push their commits to a claude/-prefixed branch
# rather than main whenever a direct push to main isn't accepted (a
# protected main, or just the routine's default safe behavior) -- see
# CLAUDE.md step 10. This picks that branch up, opens a PR against main,
# and merges it automatically once required checks (ci.yml) pass, so the
# daily digest reaches main -- and GitHub Pages -- without a manual click.

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open a PR for this branch (or reuse an existing one)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create \
              --head "$branch" \
              --base main \
              --title "digest: $(date +%F) (routine run on $branch)" \
              --body "Automated PR from a Claude Code routine run. Merges automatically once CI passes -- see .github/workflows/auto-merge-routine.yml."
            number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.pr.outputs.number }} --squash --auto --delete-branch
