name: Auto-merge routine PRs

# The Claude Code routine opens its own PR when it can't push straight to
# main (see CLAUDE.md step 10) -- it authenticates as the real GitHub
# account through the routine's GitHub proxy, so it can create PRs even
# though GitHub Actions' own token normally can't (that needs a repo
# setting most repos leave off, and previously made this workflow fail at
# the PR-creation step). This workflow's only job now is to merge that PR
# automatically once CI passes, which only needs "Allow auto-merge"
# enabled under Settings -> General -> Pull Requests -- no Actions
# PR-creation permission required at all.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only PRs from the routine's own branches -- never auto-merge a PR
    # opened by anyone/anything else against this filter.
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash --auto --delete-branch \
            --repo "${{ github.repository }}"
